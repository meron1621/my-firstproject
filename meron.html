<!DOCTYPE html>
<html>
<body>

<h2>Multiply Two Numbers</h2>

<form>
  Number 1: <input type="number" id="num1"><br><br>
  Number 2: <input type="number" id="num2"><br><br>

  <button type="button" onclick="multiply()">Multiply</button>
</form>

<p id="result"></p>

<script>
function multiply() {
  let a = document.getElementById("num1").value;
  let b = document.getElementById("num2").value;
  let ans = a * b;
  document.getElementById("result").innerHTML = "Result: " + ans;
}
</script>

</body>
</html>
